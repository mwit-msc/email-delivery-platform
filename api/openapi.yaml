openapi: 3.1.0
info:
  title: Email Delivery Platform
  version: 1.4.0
  description: Application-scoped bearer API for durable delivery, templates, campaigns, assets, and webhooks.
    relay.manage is a privileged platform-wide permission. Expanded API operations reject unknown JSON
    fields and multiple JSON values.
security:
- serviceKey: []
components:
  securitySchemes:
    serviceKey:
      type: http
      scheme: bearer
  schemas:
    Message:
      type: object
      required:
      - to
      - template
      - variables
      properties:
        to:
          type: string
          format: email
        cc:
          $ref: '#/components/schemas/CCRecipients'
        bcc:
          $ref: '#/components/schemas/BCCRecipients'
        template:
          type: string
        template_version:
          type: integer
          minimum: 1
        variables:
          type: object
          additionalProperties:
            type: string
        class:
          type: string
          enum:
          - transactional
          - otp
          default: transactional
        schedule_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        application_id:
          type: string
          description: Optional; must match the bearer key application. Omit to use key scope.
      additionalProperties: false
    CCRecipients:
      type: array
      maxItems: 20
      items:
        type: string
        format: email
      description: Bare CC mailbox addresses. Whitespace and domain casing are normalized;
        duplicates and the To recipient are removed. Copies consume daily recipient quota
        and recipient cooldown limits. CC and BCC together allow at most 20 unique copies;
        duplicates across lists are kept in CC.
    BCCRecipients:
      type: array
      maxItems: 20
      items:
        type: string
        format: email
      description: Bare blind-copy mailboxes, hidden from MIME headers. Whitespace and domain casing
        are normalized; duplicates of To or CC are removed. Copies consume daily quota and
        recipient cooldown limits. CC and BCC together allow at most 20 unique copies.
    CampaignBCC:
      type: object
      properties:
        bcc:
          $ref: '#/components/schemas/BCCRecipients'
      required: [bcc]
      additionalProperties: false
    CampaignCC:
      type: object
      properties:
        cc:
          $ref: '#/components/schemas/CCRecipients'
      required: [cc]
      additionalProperties: false
    OTPCreate:
      type: object
      additionalProperties: false
      required: [to, purpose]
      properties:
        to:
          type: string
          format: email
          description: Single bare mailbox; no CC or BCC. Domain casing and surrounding whitespace are normalized.
        purpose:
          type: string
          maxLength: 64
          pattern: '^[a-z][a-z0-9._-]{0,63}$'
          description: Intent such as login or verify_email. Creation normalizes surrounding whitespace and casing.
    OTPChallenge:
      type: object
      required: [id, message_id, expires_at, replayed]
      additionalProperties: false
      properties:
        id:
          type: string
        message_id:
          type: string
        expires_at:
          type: string
          format: date-time
        replayed:
          type: boolean
    OTPVerify:
      type: object
      additionalProperties: false
      required: [purpose, code]
      properties:
        purpose:
          type: string
          minLength: 1
          maxLength: 64
          description: Exact normalized purpose from creation; mismatch consumes a failed attempt.
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: The six-digit string received by email; preserve leading zeroes. Incorrect values consume an attempt.
    OTPVerification:
      type: object
      additionalProperties: false
      required: [verified]
      properties:
        verified:
          type: boolean
        to:
          type: string
          format: email
          description: Present only on success. Match against the mailbox expected by your application.
        purpose:
          type: string
          description: Present only on success.
    Error:
      type: object
      properties:
        error:
          type: string
      additionalProperties: false
      required:
      - error
    TemplateInput:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9._-]{1,100}$
        name:
          type: string
          maxLength: 200
        subject:
          type: string
          maxLength: 998
          description: Required; no CR/LF; byte limit 998.
        html:
          type: string
          description: Sanitized email HTML; maximum 2 MiB.
        plain:
          type: string
          description: Plain-text alternative; generated from HTML when empty; maximum 2 MiB.
        project:
          description: Sanitized GrapesJS project JSON; maximum 2 MiB.
        version:
          type: integer
          minimum: 1
          description: Current version required when updating; optimistic concurrency check. Creation
            always starts at version 1.
      additionalProperties: false
      required:
      - subject
      description: Creation also requires slug and name. Updates append an immutable version and do not
        rename the template.
    TemplatePreview:
      type: object
      properties:
        template:
          $ref: '#/components/schemas/TemplateInput'
        variables:
          type: object
          additionalProperties:
            type: string
        version:
          type: integer
          minimum: 0
          description: Stored version to preview; zero or omitted selects current version. Ignored when
            template is supplied.
      additionalProperties: false
      required:
      - variables
      description: Supply template to render unsaved content without persisting or sending it; otherwise
        render a stored version.
    RenderedTemplate:
      type: object
      properties:
        subject:
          type: string
        html:
          type: string
        plain:
          type: string
        document:
          type: string
          description: Full sanitized HTML document with application-owned font loading. Use for browser
            preview; html remains the editable fragment. Email clients may use system font fallbacks.
      additionalProperties: false
      required:
      - subject
      - html
      - plain
    AwardRule:
      type: object
      properties:
        event:
          type: string
          description: Exact imported event value, or empty to match any event.
        award:
          type: string
          description: Exact imported award label.
        template:
          type: string
          description: Template slug or ID in this application.
        variables:
          type: object
          maxProperties: 64
          additionalProperties:
            type: string
            maxLength: 4096
          description: Text variables for this award. Override mapping constants and columns; escaped
            during rendering. Lets several awards share one template.
      additionalProperties: false
      required:
      - award
      - template
    Mapping:
      type: object
      properties:
        email:
          type: integer
          minimum: -1
          maximum: 51
          description: Zero-based column index; -1 means no column.
        school:
          type: integer
          minimum: -1
          maximum: 51
          description: Zero-based column index; -1 means no column.
        event:
          type: integer
          minimum: -1
          maximum: 51
          description: Zero-based column index; -1 means no column.
        award:
          type: integer
          minimum: -1
          maximum: 51
          description: Zero-based column index; -1 means no column.
        url:
          type: integer
          minimum: -1
          maximum: 51
          description: Zero-based column index; -1 means no column.
        default_event:
          type: string
        default_award:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AwardRule'
        columns:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 51
          description: Additional template variable names mapped to zero-based columns.
        constants:
          type: object
          additionalProperties:
            type: string
        skip_rows_without_email:
          type: boolean
          default: false
          description: Skip rows whose mapped email cell is empty, such as worksheet footers.
        combine_recipients:
          type: boolean
          default: false
          description: Combine valid, included certificates with the same recipient, school and event
            into one email. Invalid and excluded source rows remain separate. Does not combine campaigns.
        combined_template:
          type: string
          description: Template slug or ID required when combining. HTML and plain text must contain
            the safe '{{certificate_list}}' block; single-certificate certificate_url and award_text placeholders
            are disallowed. Selected version and item data are frozen with the mapping.
        name_columns:
          type: array
          maxItems: 52
          items:
            type: integer
            minimum: 0
            maximum: 51
          description: Participant name columns, required when combining. Multiple nonempty cells
            are joined for a team certificate. Item awards use rule award_text or the original award.
      additionalProperties: false
      required:
      - email
      - school
      - event
      - award
      - url
      description: Certificate mapping. An empty event/award cell uses its default. Without a matching
        rule, template slug is event.award. Supplies school_name and certificate_url automatically. Additional
        columns override constants of the same name. Matching award-rule variables override both.
    BulkMapping:
      type: object
      properties:
        template:
          type: string
          description: Template slug or ID.
        email:
          type: integer
          minimum: 0
          maximum: 51
        columns:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 51
        constants:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false
      required:
      - template
      - email
      description: General bulk mapping. Column values override constants with the same name.
    CampaignCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        kind:
          type: string
          enum:
          - certificate
          - bulk
          default: certificate
        cc:
          $ref: '#/components/schemas/CCRecipients'
        bcc:
          $ref: '#/components/schemas/BCCRecipients'
      additionalProperties: false
      required:
      - name
    CampaignImport:
      type: object
      properties:
        rows:
          type: array
          items:
            type: array
            items:
              type: string
            maxItems: 52
          maxItems: 5001
          description: First row is headers; at most 5000 data rows.
        sheet_url:
          type: string
          format: uri
          description: Read-only Google Sheets URL; gid selects the tab. Requires configured service-account
            access.
      additionalProperties: false
      description: Supply rows or sheet_url. A nonempty sheet_url selects Google Sheets import.
    CampaignAction:
      type: object
      properties:
        schedule_at:
          type: string
          format: date-time
          description: For start; RFC3339. Omit to start now.
        to:
          type: string
          format: email
          description: For test; receives one test email using the first valid included row.
        row_id:
          type: string
          description: For exclude.
        excluded:
          type: boolean
          description: For exclude; false includes a previously excluded row.
      additionalProperties: false
      description: Every action requires a JSON object, including {} when no fields are needed. Actions
        preserve campaign state and delivery limits.
    RelayInput:
      type: object
      properties:
        id:
          type: string
          description: Optional on creation; update/test path ID takes precedence. Omit to create an opaque
            ID.
        name:
          type: string
          maxLength: 120
        address:
          type: string
          description: SMTP host:port; numeric port 1–65535.
        username:
          type: string
          maxLength: 512
        password:
          type: string
          maxLength: 4096
          writeOnly: true
          description: Replacement secret; blank retains an existing secret.
        tls:
          type: string
          enum:
          - tls
          - starttls
          - none
          description: none is development-only.
        bounce_domain:
          type: string
          description: Optional exact ASCII/punycode envelope-sender domain.
        allowed_domains:
          type: array
          items:
            type: string
          description: Exact lowercased sender From-address domains; no wildcards or suffix matching.
            New relays require at least one. Empty lists allow no sending.
        enabled:
          type: boolean
          description: Send true explicitly to enable the relay.
        fallback_id:
          type: string
          description: Optional named fallback relay ID; empty removes fallback. Cycles are rejected.
        clear_password:
          type: boolean
          default: false
          description: Explicitly remove the saved SMTP password; do not combine with a new password.
      additionalProperties: false
      required:
      - name
      - address
      - tls
      - allowed_domains
      - enabled
    RelayRouting:
      type: object
      properties:
        strict:
          type: boolean
          description: Deprecated mode control. v1.3.0 always requires named routes; false is rejected. Cannot combine with domain.
        domain:
          type: string
          description: Exact sender From-address domain, normalized to lowercase ASCII/punycode.
        relay_id:
          type: string
          description: Relay allowing this domain; empty removes this domain route.
      additionalProperties: false
      description: Supply either strict, or domain and relay_id. Strict mode rejects unmapped sender domains.
        v1.3.0 rejects disabling strict routing; all sender domains require named routes.
    WebhookInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        url:
          type: string
          format: uri
          description: Public HTTPS URL without credentials/fragments. All DNS answers must be public;
            redirects are not followed.
        secret:
          type: string
          writeOnly: true
          maxLength: 1024
          description: New endpoints require a 32–1024 byte signing secret. Blank retains existing secret
            on update.
        enabled:
          type: boolean
          description: Send true explicitly to enable; false cancels outstanding deliveries.
      additionalProperties: false
      required:
      - name
      - url
      - enabled
    WebhookEvent:
      type: object
      properties:
        event_id:
          type: integer
        message_id:
          type: string
        application_id:
          type: string
        campaign_id:
          type:
          - string
          - 'null'
        status:
          type: string
        detail:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - event_id
      - message_id
      - application_id
      - status
      - created_at
    CreatedID:
      type: object
      properties:
        id:
          type: string
      additionalProperties: false
      required:
      - id
    Success:
      type: object
      properties:
        success:
          type: boolean
      additionalProperties: false
      required:
      - success
    Me:
      type: object
      properties:
        application_id:
          type: string
        key_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        version:
          type: string
      additionalProperties: false
      required:
      - application_id
      - key_id
      - scopes
      - version
  responses:
    BadRequest:
      description: Invalid input or operation not permitted in the current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Bearer service key required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Permission or application scope denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /v1/otp/challenges:
    post:
      operationId: createOTPChallenge
      summary: Generate and email a single-use verification code
      description: Requires otp.create. Sends a fixed verification email through normal application
        routing, quotas and OTP-priority delivery. The six-digit code expires five minutes after creation
        and allows five failed guesses. No code is returned. Requests to the same mailbox in an application
        share a 60-second cooldown across purposes. A new request for the same mailbox and purpose revokes
        the old challenge atomically with admission; admission failure preserves the old challenge.
        Idempotent replay preserves the original expiry and verification state and does not resend.
        Codes must be verified by an application server; do not expose service keys in browsers.
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPCreate'
      responses:
        '202':
          description: Challenge and delivery job committed, or idempotent replay. Email delivery is asynchronous.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency payload conflict or application paused.
        '429':
          description: Recipient cooldown, daily recipient quota or queue capacity reached. No challenge admitted.
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: Platform sending paused.
  /v1/otp/challenges/{id}/verify:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    post:
      operationId: verifyOTPChallenge
      summary: Verify and atomically consume an app-scoped email code
      description: Requires otp.verify. A challenge can succeed only once, even across concurrent
        requests. Incorrect codes or purposes consume one of five attempts. Expired, revoked, consumed,
        exhausted, unknown and foreign-application challenges all return verified false without recipient
        metadata. A successful response returns the verified mailbox and purpose, not a login session.
        Keep the challenge ID tied to the expected mailbox/purpose in your application; it is not an identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerify'
      responses:
        '200':
          description: Verification result. On success the code is consumed and cannot be replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPVerification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/messages:
    post:
      operationId: submitMessage
      summary: Persist a message for asynchronous delivery
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        '202':
          description: Durably accepted or replayed
          with id and status_url: null
        '400':
          description: Invalid message or missing template variables
        '401':
          description: Service key missing or invalid
        '403':
          description: Scope denied
        '409':
          description: Conflicting idempotency payload or paused application
        '429':
          description: Quota or queue capacity exceeded; no message persisted
        '503':
          description: Platform admission paused
      description: Requires message.send; OTP class also requires message.otp. Only transactional or OTP
        admission; bulk uses campaign approval and start. Sender relay is chosen from the application
        From domain and persisted durably.
  /v1/messages/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    get:
      operationId: getMessage
      summary: Read an application's message delivery status
      responses:
        '200':
          description: Message status and attempt count
        '401':
          description: Authentication required
        '403':
          description: Key cannot read this application's messages
        '404':
          description: Message not found
      description: Requires message.view. relay_accepted is gateway acceptance; remote_accepted is recipient-server
        acceptance, not inbox placement or reading.
  /v1/messages/{id}/cancel:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    post:
      operationId: cancelMessage
      summary: Cancel before the SMTP dispatch boundary
      responses:
        '200':
          description: Cancelled
        '401':
          description: Authentication required
        '403':
          description: Cancellation scope denied
        '404':
          description: Message not found
        '409':
          description: Already in flight or terminal
      description: Requires message.cancel. In-flight SMTP delivery cannot be recalled.
  /v1/delivery-events:
    post:
      operationId: reportDelivery
      summary: Ingest trusted, deduplicated gateway transport feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message_id
              - status
              - event_key
              properties:
                message_id:
                  type: string
                status:
                  type: string
                  enum:
                  - remote_accepted
                  - bounced
                event_key:
                  type: string
                  maxLength: 200
                detail:
                  type: string
                  maxLength: 512
      responses:
        '200':
          description: Recorded or replayed
        '400':
          description: Invalid report
        '401':
          description: Authentication required
        '403':
          description: Reporting scope denied
        '404':
          description: Message outside application or not found
        '409':
          description: Invalid message state or conflicting event key
      description: Requires privileged delivery.report, issued by a platform administrator. Trusted outcomes
        are application-scoped and event-key deduplicated.
  /v1/me:
    get:
      operationId: getServiceIdentity
      summary: Inspect service-key application, scopes, and server version
      description: Requires any valid service key.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/templates:
    get:
      operationId: listTemplates
      summary: List current templates in this application
      description: Requires template.view. Archived templates are hidden by default.
      parameters:
      - in: query
        name: include_archived
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: false
                required:
                - templates
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createTemplate
      summary: Create a template and immutable version 1
      description: Requires template.edit.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  version:
                    type: integer
                additionalProperties: false
                required:
                - id
                - version
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInput'
  /v1/templates/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    get:
      operationId: getTemplate
      summary: Read template content and editor project
      description: Requires template.view.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - in: query
        name: version
        schema:
          type: integer
          minimum: 1
        description: Omit to read the current version.
    put:
      operationId: updateTemplate
      summary: Append a template version with optimistic concurrency
      description: Requires template.edit.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  version:
                    type: integer
                  variables:
                    type: array
                    items:
                      type: string
                additionalProperties: false
                required:
                - id
                - version
                - variables
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Current version changed; reload before saving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInput'
  /v1/templates/{id}/preview:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    post:
      operationId: previewTemplate
      summary: Render stored or unsaved email content without sending
      description: Requires template.view.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderedTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplatePreview'
  /v1/assets:
    post:
      operationId: uploadEmailAsset
      summary: Upload a publicly accessible email logo or image
      description: Requires template.edit. Maximum 100 assets per application. Returned opaque URL is
        public and immutable so email clients can load it; upload no private images.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  url:
                    type: string
                    format: uri
                  mime_type:
                    type: string
                    enum:
                    - image/png
                    - image/jpeg
                    - image/gif
                additionalProperties: false
                required:
                - id
                - url
                - mime_type
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG/JPEG/GIF up to 1 MiB and 16 megapixels.
              additionalProperties: false
              required:
              - file
  /email-assets/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    get:
      operationId: getEmailAsset
      summary: Load an email image by its opaque public URL
      security: []
      responses:
        '200':
          description: Immutable image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '404':
          description: Asset not found
  /v1/imports/workbook-sheets:
    post:
      operationId: listWorkbookSheets
      summary: Inspect XLSX tab names without importing
      description: Requires campaign.edit.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  sheets:
                    type: array
                    items:
                      type: string
                additionalProperties: false
                required:
                - sheets
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: XLSX workbook up to 8 MiB.
              additionalProperties: false
              required:
              - file
  /v1/campaigns:
    get:
      operationId: listCampaigns
      summary: List up to 1000 recent campaigns in this application
      description: Requires campaign.view.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: false
                required:
                - campaigns
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCampaign
      summary: Create a draft bulk or certificate campaign
      description: Requires campaign.edit. Requires a key issued by the dashboard with a recorded user
        owner; recreate legacy ownerless keys.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  state:
                    type: string
                    enum:
                    - draft
                additionalProperties: false
                required:
                - id
                - state
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
  /v1/campaigns/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    get:
      operationId: getCampaign
      summary: Read campaign, mapping, and up to 5000 recipient rows
      description: Requires campaign.view.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/campaigns/{id}/import:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    post:
      operationId: importCampaign
      summary: Replace the source snapshot of a draft campaign
      description: Requires campaign.edit. First row is headers. Supports 5000 data rows and 52 columns;
        trailing blanks are trimmed. Workbook formulas are not evaluated and external resources are not
        fetched; cell hyperlink URLs are preserved.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: integer
                  headers:
                    type: array
                    items:
                      type: string
                additionalProperties: false
                required:
                - rows
                - headers
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignImport'
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV, TSV or XLSX up to 8 MiB. CSV delimiters are detected (comma, semicolon or tab).
                sheet:
                  type: string
                  description: Exact XLSX tab name; defaults to first tab when omitted.
              additionalProperties: false
              required:
              - file
  /v1/campaigns/{id}/mapping:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    post:
      operationId: mapCampaign
      summary: Validate and render draft recipient rows
      description: Requires campaign.edit. Use Mapping for certificate campaigns and BulkMapping for bulk
        campaigns. Inspect returned campaign rows for validation errors before approval.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  mapped:
                    type: boolean
                additionalProperties: false
                required:
                - mapped
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/Mapping'
              - $ref: '#/components/schemas/BulkMapping'
  /v1/campaigns/{id}/cc:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: setCampaignCC
      summary: Set or clear the CC list on a draft campaign
      description: Requires campaign.edit. Approval freezes copies. An approved but unsent
        campaign must return to draft before editing and be approved again. Saving CC does
        not queue mail. Test sends intentionally omit campaign CC and BCC and go only to the test address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCC'
      responses:
        '200':
          description: Saved; no message queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: boolean
        '400':
          description: Invalid addresses, missing array, or campaign is not draft.
        '401':
          description: Invalid or missing authentication.
        '403':
          description: Insufficient permission.
        '404':
          description: Campaign absent in this application.
  /v1/campaigns/{id}/bcc:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: setCampaignBCC
      summary: Set or clear the BCC list on a draft campaign
      description: Requires campaign.edit. Approval freezes copies. An approved but unsent
        campaign must return to draft before editing and be approved again. Saving BCC does
        not queue mail. Test sends intentionally omit campaign BCC and go only to the test address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignBCC'
      responses:
        '200':
          description: Saved; no message queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: boolean
        '400':
          description: Invalid addresses, missing array, or campaign is not draft.
        '401':
          description: Invalid or missing authentication.
        '403':
          description: Insufficient permission.
        '404':
          description: Campaign absent in this application.
  /v1/campaigns/{id}/{action}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    - in: path
      name: action
      required: true
      schema:
        type: string
        enum:
        - approve
        - start
        - pause
        - resume
        - cancel
        - draft
        - exclude
        - test
    post:
      operationId: controlCampaign
      summary: Approve, schedule, test, or control a campaign
      description: Requires campaign.approve for approve; campaign.send for start/pause/resume/cancel;
        campaign.edit for draft/exclude/test. Requires a recorded key owner for every action. Approval
        requires valid included rows. Start persists the frozen jobs atomically. draft is allowed only
        while approved and unsent; exclusion is draft-only. Test sends one email to to and consumes normal
        delivery quota.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignAction'
  /v1/campaigns/{id}/progress:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    get:
      operationId: getCampaignProgress
      summary: Read campaign state and delivery counts
      description: Requires campaign.view.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  state:
                    type: string
                  statuses:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                        count:
                          type: integer
                      additionalProperties: false
                      required:
                      - status
                      - count
                additionalProperties: false
                required:
                - id
                - state
                - statuses
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/campaigns/{id}/export:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    get:
      operationId: exportCampaignResults
      summary: Download validation and delivery results as CSV
      description: 'Requires campaign.view. UTF-8 CSV with BOM. Columns: source_row, recipient, template,
        excluded, validation_errors, message_id, status, attempts, delivery_detail. Spreadsheet formula-leading
        cells are escaped.'
      responses:
        '200':
          description: CSV results
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/campaigns/{id}/source:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    get:
      operationId: downloadCampaignSource
      summary: Download the normalized recipient import snapshot
      description: Requires campaign.view. Includes headers and all imported rows, including excluded
        and skipped rows. Original workbook bytes are not retained. CSV uses UTF-8 with BOM and
        protects formula-leading cells; JSON preserves snapshot cell strings exactly. Available in all campaign states.
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum: [csv, json]
          default: csv
      responses:
        '200':
          description: Stored source snapshot
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: array
                      items:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Campaign or imported snapshot unavailable.
  /v1/webhooks:
    get:
      operationId: listWebhooks
      summary: List endpoints and pending/failed counts without secrets
      description: Requires webhook.manage.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: false
                required:
                - webhooks
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createWebhook
      summary: Register a signed delivery-event webhook
      description: Requires webhook.manage. Maximum 20 endpoints per application. Events are delivered
        at least once with eight attempts over at least 25.5 hours of backoff. Receivers deduplicate EDP-Event-ID,
        validate freshness of EDP-Timestamp (Unix seconds), and verify EDP-Signature = v1=<hex HMAC-SHA256(secret,
        timestamp + "." + exact request bytes)>. Success requires HTTP 2xx. Destination DNS is checked
        on configuration and each connection; no redirects.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInput'
  /v1/webhooks/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    put:
      operationId: updateWebhook
      summary: Update endpoint, rotate its signing secret, or disable it
      description: Requires webhook.manage. Blank secret retains the saved secret. Disabling cancels queued/in-flight
        webhook jobs; a request already transmitted may still arrive.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInput'
  /v1/relays:
    get:
      operationId: listRelays
      summary: Read named relays, exact domain routes, and strict mode
      description: Requires relay.manage (privileged platform-wide). Only platform administrators may
        issue relay.manage keys. Relay records expose password_set, never passwords or ciphertext.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  relays:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  routes:
                    type: array
                    items:
                      type: object
                      properties:
                        domain:
                          type: string
                        relay_id:
                          type: string
                      additionalProperties: false
                      required:
                      - domain
                      - relay_id
                  strict:
                    type: boolean
                additionalProperties: false
                required:
                - relays
                - routes
                - strict
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createRelay
      summary: Create a named SMTP relay
      description: Requires relay.manage (privileged platform-wide).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayInput'
  /v1/relays/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    put:
      operationId: updateRelay
      summary: Update a named relay and encrypted connection secret
      description: Requires relay.manage (privileged platform-wide). Blank password retains; clear_password
        removes. Disabling a relay or removing its domain allowance blocks dispatch through that relay.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayInput'
    delete:
      operationId: deleteRelay
      summary: Delete an unreferenced named SMTP relay
      description: Requires relay.manage (privileged platform-wide). Remove sender-domain routes and
        fallback references first. A relay referenced by any message, including delivery history,
        must be retained and can be disabled instead. Reference checks and deletion are transactional.
      responses:
        '204':
          description: Relay deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Relay not found.
        '409':
          description: Relay is still referenced.
  /v1/relays/{id}/test:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    post:
      operationId: testRelay
      summary: Test entered SMTP configuration without saving or sending
      description: Requires relay.manage (privileged platform-wide). Supply connection fields; blank password
        uses the saved secret for this ID. Connects, negotiates TLS, authenticates, and sends NOOP; no
        MAIL, RCPT, or DATA.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                additionalProperties: false
                required:
                - success
                - message
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayInput'
  /v1/relay-routing:
    put:
      operationId: setRelayRouting
      summary: Set strict mode or one exact sender-domain route
      description: Requires relay.manage (privileged platform-wide). Domains refer to the application
        From address, not recipient domains. Named fallback is per source relay, opt-in per application,
        once only after confirmed permanent IP reputation rejection; both relays must explicitly allow
        the sender domain. No fallback for uncertainty, deferrals, invalid recipients, or quarantine.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayRouting'
  /v1/templates/{id}/archive:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: setTemplateArchived
      summary: Archive or restore a template
      description: Requires template.edit in this application. Hides templates from default lists and
        new campaign pickers without deleting versions, changing existing campaigns, or disabling
        rendering by ID or slug. Set archived to false to restore.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [archived]
              properties:
                archived:
                  type: boolean
      responses:
        '200':
          description: Archive state saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, archived]
                properties:
                  id:
                    type: string
                  archived:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Template not found in this application
